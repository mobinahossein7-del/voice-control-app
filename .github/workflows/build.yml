name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Clean previous buildozer cache
      run: |
        rm -rf ~/.buildozer
        rm -rf .buildozer

    - name: Install dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            ccache \
            libncurses5 \
            libstdc++6 \
            zlib1g-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            libltdl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.33 buildozer

    - name: Install Android SDK packages and accept licenses
      run: |
        # تثبيت أداة الـ sdkmanager عبر بيئة أندرويد الافتراضية لـ buildozer أو استخدام الأمر المباشر
        export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p $ANDROID_HOME
        
        # السماح لـ buildozer بتحضير الـ SDK أولاً لتوفير المسارات
        yes | buildozer android pgs || true
        
        # أو تثبيت الأدوات يدوياً لضمان وجود الـ aidl و build-tools
        if [ -d "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin" ]; then
            export PATH="$PATH:$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin"
            yes | sdkmanager --licenses || true
            sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0" || true
        fi

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
